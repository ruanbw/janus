# Janus 生产环境编排:Postgres + Go 后端 + 前端静态服务(nginx)+ Caddy(on-demand TLS,Let's Encrypt)
# 前后端分离(ADR-0006):backend 与 web 是两个独立构建目标、独立镜像、独立发版。
# 使用:cp .env.example .env 并填入生产值,然后 docker compose -f docker-compose.prod.yml up -d
# 详细说明与上线检查清单见 docs/deploy.md

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${JANUS_DB_USER:-janus}
      POSTGRES_PASSWORD: ${JANUS_DB_PASSWORD:?JANUS_DB_PASSWORD 必须设置}
      POSTGRES_DB: ${JANUS_DB_NAME:-janus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JANUS_DB_USER:-janus} -d ${JANUS_DB_NAME:-janus}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: backend
    environment:
      JANUS_ADDR: ":8080"
      JANUS_DATABASE_URL: "postgres://${JANUS_DB_USER:-janus}:${JANUS_DB_PASSWORD:?}@postgres:5432/${JANUS_DB_NAME:-janus}?sslmode=disable"
      JANUS_PLATFORM_DOMAIN: "${JANUS_PLATFORM_DOMAIN:?JANUS_PLATFORM_DOMAIN 必须设置(裸平台域名)}"
      JANUS_SERVER_PUBLIC_IP: "${JANUS_SERVER_PUBLIC_IP:?JANUS_SERVER_PUBLIC_IP 必须设置(服务器公网 IP)}"
      JANUS_SUPERADMIN_EMAIL: "${JANUS_SUPERADMIN_EMAIL:-}"
      # on-demand TLS ask 端点的共享密钥:必须与 caddy 容器的 CADDY_ASK_TOKEN 同值。
      # 后端拿不到时 /internal/caddy/authorize 一律 403,Caddy 一张证书都签不出来。
      JANUS_CADDY_ASK_TOKEN: "${JANUS_CADDY_ASK_TOKEN:?未配置 JANUS_CADDY_ASK_TOKEN,后端无法校验 on-demand TLS 的 ask 请求}"
      # 生产必须 true:HTTPS 下 Secure cookie 生效
      JANUS_COOKIE_SECURE: "true"
      JANUS_MIGRATIONS_DIR: "/app/migrations"
      # 可选参数与 .env.example/代码默认值一致(compose 显式转发,便于 .env 覆盖)
      JANUS_SESSION_TTL: "${JANUS_SESSION_TTL:-720h}"
      JANUS_SESSION_TTL_SHORT: "${JANUS_SESSION_TTL_SHORT:-24h}"
      JANUS_VERIFY_TOKEN_TTL: "${JANUS_VERIFY_TOKEN_TTL:-24h}"
      JANUS_RESET_TOKEN_TTL: "${JANUS_RESET_TOKEN_TTL:-1h}"
      # JWT(API Bearer 认证):密钥必须配置强随机值(openssl rand -hex 32);留空则每次启动随机,重启后已签发 token 失效
      JANUS_JWT_SECRET: "${JANUS_JWT_SECRET:-}"
      JANUS_JWT_TTL: "${JANUS_JWT_TTL:-24h}"
      JANUS_DNS_RETRY_INTERVAL: "${JANUS_DNS_RETRY_INTERVAL:-5m}"
      JANUS_DNS_MAX_AGE: "${JANUS_DNS_MAX_AGE:-72h}"
      # 泛域名证书模式(默认关闭):开启时必须同时换用 Caddyfile.prod.wildcard,见 docs/deploy.md
      JANUS_WILDCARD_TLS: "${JANUS_WILDCARD_TLS:-false}"
      JANUS_VISIT_RETENTION: "${JANUS_VISIT_RETENTION:-2160h}"
      JANUS_VISIT_CLEANUP_INTERVAL: "${JANUS_VISIT_CLEANUP_INTERVAL:-24h}"
      # 访问记录异步写入队列 / 连接池 / 301 缓存(见 .env.example)
      JANUS_VISIT_QUEUE_SIZE: "${JANUS_VISIT_QUEUE_SIZE:-10000}"
      JANUS_VISIT_QUEUE_WORKERS: "${JANUS_VISIT_QUEUE_WORKERS:-2}"
      JANUS_VISIT_QUEUE_BATCH: "${JANUS_VISIT_QUEUE_BATCH:-200}"
      JANUS_DB_MAX_OPEN_CONNS: "${JANUS_DB_MAX_OPEN_CONNS:-25}"
      JANUS_REDIRECT_301_MAX_AGE: "${JANUS_REDIRECT_301_MAX_AGE:-5m}"
      # 上传落地页:容器内固定目录,由 uploads 卷持久化
      JANUS_LANDING_UPLOAD_DIR: "/app/uploads"
      JANUS_LANDING_MAX_ZIP_BYTES: "${JANUS_LANDING_MAX_ZIP_BYTES:-10485760}"
      JANUS_LANDING_MAX_FILES: "${JANUS_LANDING_MAX_FILES:-500}"
      # 邮件:SMTP 凭据来自 .env(未配置时用控制台 mailer)
      JANUS_PUBLIC_BASE_URL: "https://${JANUS_PLATFORM_DOMAIN:?}"
      JANUS_SMTP_HOST: "${JANUS_SMTP_HOST:-}"
      JANUS_SMTP_PORT: "${JANUS_SMTP_PORT:-465}"
      JANUS_SMTP_USERNAME: "${JANUS_SMTP_USERNAME:-}"
      JANUS_SMTP_PASSWORD: "${JANUS_SMTP_PASSWORD:-}"
      JANUS_SMTP_FROM: "${JANUS_SMTP_FROM:-}"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 前端静态服务:仅 nginx + 构建产物,无任何后端代码(ADR-0006)。
  # 前端改版只重建本服务(docker compose build web),不触碰 backend。
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    # 泛域名证书模式需要带 DNS 插件的 Caddy 构建(官方镜像不含),例如用
    #   FROM caddy:2-builder AS b
    #   RUN xcaddy build --with github.com/caddy-dns/cloudflare
    #   FROM caddy:2
    #   COPY --from=b /usr/bin/caddy /usr/bin/caddy
    # 构建自己的镜像并替换下面的 image,详见 docs/deploy.md「泛域名证书模式」。
    image: caddy:2
    environment:
      # 站点域名在 Caddyfile.prod 中硬编码,此处 PLATFORM_DOMAIN 仅用于 NO_PROXY 与提示
      PLATFORM_DOMAIN: "${JANUS_PLATFORM_DOMAIN:?}"
      ACME_EMAIL: "${JANUS_ACME_EMAIL:-}"
      # on_demand_tls.ask 的共享密钥:必须与后端的 JANUS_CADDY_ASK_TOKEN 同值。
      # Caddyfile.prod 用 {$CADDY_ASK_TOKEN} 在 adapt 时展开,变量缺失会展开成空 token,
      # 授权端点一律 403 —— 表现为租户域名握手失败,且 Caddy 侧看不出原因。
      CADDY_ASK_TOKEN: "${JANUS_CADDY_ASK_TOKEN:?未配置 JANUS_CADDY_ASK_TOKEN,caddy 容器拿不到 on-demand TLS 的 ask 密钥}"
      # 泛域名证书模式:DNS-01 质询用的 DNS 提供商 API 凭据(Caddyfile.prod.wildcard 读 {env.CADDY_DNS_API_TOKEN});默认模式不使用
      CADDY_DNS_API_TOKEN: "${JANUS_CADDY_DNS_API_TOKEN:-}"
      # 生产容器同样需绕开宿主代理,授权端点直连 backend
      NO_PROXY: "backend,localhost,127.0.0.1,.${JANUS_PLATFORM_DOMAIN:?}"
      no_proxy: "backend,localhost,127.0.0.1,.${JANUS_PLATFORM_DOMAIN:?}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 泛域名证书模式改挂 ./Caddyfile.prod.wildcard
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  uploads:
