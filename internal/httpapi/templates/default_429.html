<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>429 - 请求过于频繁</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /*
     * 深色模式走系统偏好(prefers-color-scheme),不引 JS、不读 localStorage:
     * 这两页是服务端原样输出的静态页,唯一的外部依赖是浏览器本身。
     * 与 default_404.html 保持同一套深色取值,两个页面在系统深色下应该
     * 看起来是同一套设计而不是两个站点。
     */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      max-width: 28rem;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 50%;
      background: #ffedd5;
      color: #f97316;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #0b1120; color: #cbd5e1; }
      .card {
        background: #111827;
        border-color: #1f2937;
        /* 与 404 页同理:浅色下那层几乎不可见的投影,在深色底上会变成脏边。 */
        box-shadow: none;
      }
      .badge { background: #431407; color: #fb923c; }
      h1 { color: #f1f5f9; }
      p { color: #94a3b8; }
      .code { color: #64748b; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">429</div>
    <h1>请求过于频繁</h1>
    <p>当前访问频次超出限制，请稍后再试。</p>
    <div class="code">HTTP 429 Too Many Requests</div>
  </div>
</body>
</html>
