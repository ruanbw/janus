<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /*
     * 深色模式走系统偏好(prefers-color-scheme),不引 JS、不读 localStorage:
     * 这两页是服务端原样输出的静态页,唯一的外部依赖是浏览器本身。
     * 声明式的好处是它与 2.7 里"自适应深色模式的静态页"这句承诺一致 ——
     * 此前模板里一处 prefers-color-scheme 都没有,全是硬编码浅色。
     * 用法跟后台一致:html.dark 由用户选择控制,系统偏好只是这里的兜底。
     */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      max-width: 28rem;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 50%;
      background: #fee2e2;
      color: #ef4444;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #0b1120; color: #cbd5e1; }
      .card {
        background: #111827;
        border-color: #1f2937;
        /* 浅色下那层几乎不可见的投影,在深色底上会变成一圈脏边,故整体去掉,
         * 改由 1px 描边承担卡片与背景的分离。 */
        box-shadow: none;
      }
      .badge { background: #450a0a; color: #f87171; }
      h1 { color: #f1f5f9; }
      p { color: #94a3b8; }
      .code { color: #64748b; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">404</div>
    <h1>页面未找到</h1>
    <p>您访问的链接不存在、已被移除或访问受到限制。</p>
    <div class="code">HTTP 404 Not Found</div>
  </div>
</body>
</html>
