# CLOAK 后台 SPA 静态服务(前后端分离,ADR-0006):
# 只负责前端静态资源与 history 路由回退,不碰任何后端逻辑。
# 后端 API(/api、/internal、/healthz)由 Caddy 按路径分流直连 Go 后端,不经过本服务。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 构建产物带内容 hash(文件改名即内容变更),可长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history 路由:/links、/admin/tenants 等前端路由一律回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不长缓存:否则前端发版后浏览器仍加载旧的资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
