# Janus CI —— 把 README「开发约定」的"提交前必须跑通"清单变成机器强制执行。
#
# 为什么必须有:此前 .github/ 不存在,gofmt / go vet / go test / pnpm type-check /
# pnpm check:ui 全都只写在 README 里,靠人记得手动跑;而 docker/Dockerfile 的
# 前端构建阶段只跑 pnpm build —— 违规前端能直接进生产镜像。
#
# 两条硬性顺序约束(改这个文件时别把它们拆开):
#   1. 前端 build 必须在 check:ui 之前:第 8 项要读 dist/assets 里的编译产物,
#      dist 不存在时它会计入违规并以非零码退出。
#   2. 后端 job 跑 `go test ./...` 做全量门禁,而日常开发只跑定向包
#      (docs/testing.md)。两件事不矛盾:仓库里已无 DB 黑盒测试,单测全部是纯逻辑,
#      不需要 Postgres 服务 —— 别为了"看起来更严谨"把数据库加回来,
#      那只会让 CI 变慢并掩盖"测试其实不碰库"这个事实。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 (gofmt / vet / test)
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          # -l 只列出未格式化的文件;有任何输出就失败。
          unformatted="$(gofmt -l internal cmd)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -count=1

  web:
    name: 前端 (type-check / build / check:ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: type-check
        run: pnpm type-check

      # build 必须在 check:ui 之前 —— 见文件头第 1 条约束。
      - name: build
        run: pnpm build

      - name: check:ui
        run: pnpm check:ui

  docker:
    name: 镜像构建 (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只验证两个镜像能构建出来,不推送任何东西。
      #
      # 为什么必须有:docker/Dockerfile 的 backend 阶段用的是显式 COPY 清单
      # (cmd/ + internal/ + pkg/ + migrations/,不是 COPY . .)。新增顶层包时漏一行,
      # 仓库内 go build ./... / go vet ./... / go test ./... 全是绿的,只有镜像编不出来 ——
      # 这个漏洞已经真实发生过一次(pkg/ 引入后没同步 COPY,生产 compose 起不来)。
      - name: backend 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: backend
          push: false
          cache-from: type=gha,scope=backend
          # ignore-error=true:fork PR 上拿不到 gha 缓存的写权限,缓存失败不该把构建判成失败
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

      # web 阶段同样受 COPY 清单与构建期变量影响(如 VITE_PLATFORM_DOMAIN),
      # 顺手一起验:镜像构建成功即代表 pnpm install/type-check/build/check:ui 在容器内跑通。
      - name: web 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          push: false
          build-args: VITE_PLATFORM_DOMAIN=example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true
