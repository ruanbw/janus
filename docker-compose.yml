# CLOAK 开发环境编排:Postgres + Go 后端 + Caddy(on-demand TLS,本地 CA)
# 使用:docker compose up -d --build
# 需用户手动步骤:
#   1. /etc/hosts 添加(需 sudo):127.0.0.1 app.cloak.test <测试租户子域>.cloak.test
#   2. 信任 Caddy 本地 CA 根证书:
#        docker compose exec caddy cat /data/caddy/pki/authorities/local/root.crt > certs/caddy-root.pem
#        sudo caddy trust --ca certs/caddy-root.pem(或 macOS 钥匙串导入并信任)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloak
      POSTGRES_PASSWORD: cloak
      POSTGRES_DB: cloak
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloak -d cloak"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      CLOAK_ADDR: ":8080"
      CLOAK_DATABASE_URL: "postgres://cloak:cloak@postgres:5432/cloak?sslmode=disable"
      CLOAK_PLATFORM_DOMAIN: "cloak.test"
      CLOAK_SERVER_PUBLIC_IP: "127.0.0.1"
      CLOAK_SUPERADMIN_EMAIL: "${CLOAK_SUPERADMIN_EMAIL:-}"
      # 开发环境经 http 访问后端(前端 Vite dev proxy),Secure cookie 不生效
      CLOAK_COOKIE_SECURE: "false"
      CLOAK_MIGRATIONS_DIR: "/app/migrations"
      # 邮件:SMTP 凭据来自 .env(未配置时用控制台 mailer)
      CLOAK_PUBLIC_BASE_URL: "${CLOAK_PUBLIC_BASE_URL:-https://app.cloak.test:8443}"
      CLOAK_SMTP_HOST: "${CLOAK_SMTP_HOST:-}"
      CLOAK_SMTP_PORT: "${CLOAK_SMTP_PORT:-465}"
      CLOAK_SMTP_USERNAME: "${CLOAK_SMTP_USERNAME:-}"
      CLOAK_SMTP_PASSWORD: "${CLOAK_SMTP_PASSWORD:-}"
      CLOAK_SMTP_FROM: "${CLOAK_SMTP_FROM:-}"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2
    environment:
      # 容器继承宿主 HTTP(S)_PROXY(如 host.docker.internal:7890),ask 授权请求必须直连 backend
      - NO_PROXY=backend,localhost,127.0.0.1,.cloak.test
      - no_proxy=backend,localhost,127.0.0.1,.cloak.test
    ports:
      # 本机已有其他服务占用 80/443/8080(如 nginx),开发环境映射到 8443;
      # 生产部署按 15-prod-deploy 使用标准 80/443 映射
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
